<script>
var CFG={judul:'Kas Dadia Arya Jelantik',tahun:'2025/2026',xls:'BUKU KAS DADIA ARYA JELANTIK'};
var RAH0=['Tilem Kesanga','Tumpek Landep','Buda Wage Klawu','Anggarkasih Prangbakat','Buda Manis Medangsia','Sugi Manik Bali'],LUAR='Di luar rahina';
var BL=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
var BS=['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'];
var IC={back:'<path d="M15 5l-7 7 7 7"/>',set:'<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',dl:'<path d="M7 3h7l5 5v13H7zM14 3v5h5M10 14h6M10 17h6"/>',down:'<path d="M6 9l6 6 6-6"/>',dots:'<circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/>',cal:'<rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/>',trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 13h8l1-13"/>',bell:'<path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21a2 2 0 0 0 4 0"/>',chk:'<path d="M5 12l5 5 9-10"/>',merge:'<path d="M6 4v6a4 4 0 0 0 4 4h8M14 10l4 4-4 4"/>',menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',home:'<path d="M4 11l8-7 8 7M6 10v10h12V10"/>',search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4-4"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
function ic(n){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+IC[n]+'</svg>';}
var $=function(i){return document.getElementById(i);};
var S={url:localStorage.getItem('bk_url')||'',awal:0,rows:[],ready:false,sync:'ok',q:[],ed:null,F:null,msg:null,toast:null,ex:{},sg:[],lastR:'',sel:undefined,mg:null,sh:false,pick:false,drawer:false,cq:'',cf:'all',pk:[]};
var busy=false,TM=null;
try{S.last=JSON.parse(localStorage.getItem('bk_last')||'null');}catch(e){}
try{var c0=JSON.parse(localStorage.getItem('bk_cache')||'null');if(c0){S.awal=c0.awal;S.rows=c0.rows;S.ready=true;}}catch(e){}

function p2(n){return(n<10?'0':'')+n;}
function today(){var d=new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());}
function fmt(n){return Math.round(n).toLocaleString('id-ID');}
function num(s){return +String(s||'0').replace(/\D/g,'')||0;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function fd(d){var p=d.split('-');return+p[2]+' '+BS[p[1]-1]+' '+p[0];}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function route(){return location.hash.slice(1)||'/';}
function persist(){try{localStorage.setItem('bk_cache',JSON.stringify({awal:S.awal,rows:S.rows}));}catch(e){}}

/* ---- data ---- */
function sorted(){return S.rows.map(function(r,i){return[r,i];}).sort(function(a,b){return a[0].tgl<b[0].tgl?-1:a[0].tgl>b[0].tgl?1:a[1]-b[1];}).map(function(x){return Object.assign({i:x[1]},x[0]);});}
function withS(){var s=S.awal;return sorted().map(function(r){s+=r.m-r.k;return Object.assign({s:s},r);});}
function total(){var m=0,k=0;S.rows.forEach(function(r){m+=r.m;k+=r.k;});return{m:m,k:k,s:S.awal+m-k};}
function rahList(){var l=RAH0.slice();S.rows.forEach(function(r){if(r.keg!==LUAR&&l.indexOf(r.keg)<0)l.push(r.keg);});if(S.F&&S.F.keg&&S.F.keg!==LUAR&&l.indexOf(S.F.keg)<0)l.push(S.F.keg);l.push(LUAR);return l;}
function ck(r){return r.keg===LUAR?'L:'+LUAR:(r.kartu||'L:'+r.keg);}
function groups(rows,desc){
 var g={},o=[];
 rows.forEach(function(r){var k=ck(r),x=g[k];if(!x){x=g[k]={k:k,keg:r.keg,a:[],first:r.tgl,last:r.tgl,li:-1};o.push(x);}x.a.push(r);if(r.tgl>x.last)x.last=r.tgl;if(r.tgl<x.first)x.first=r.tgl;if(r.i>x.li)x.li=r.i;});
 o.sort(function(a,b){var c=a.last<b.last?-1:a.last>b.last?1:a.li-b.li;return desc?-c:c;});
 return o;
}
function gTitle(g){if(g.keg===LUAR)return LUAR;var d=g.last.split('-');return g.keg+' ('+BL[d[1]-1]+' '+d[0]+')';}
function gShort(g){if(g.keg===LUAR)return LUAR;var d=g.last.split('-');return g.keg+', '+BS[d[1]-1]+' '+d[0];}
function span(g){return g.first===g.last?fd(g.first):fd(g.first)+' – '+fd(g.last);}
function pendRows(){return S.rows.filter(function(r){return r.keg===LUAR&&!r.kartu;});}

/* ---- sinkronisasi ---- */
function body(a,r){return{action:a,id:r.id,tgl:r.tgl,keg:r.keg,uraian:r.u,masuk:r.m,keluar:r.k,kartu:r.kartu||''};}
function enq(a,r){S.q.push(a==='delete'?{action:'delete',id:r.id}:body(a,r));pump();}
function pump(){
 if(busy)return;
 if(!S.q.length){S.sync='ok';hdrSync();return;}
 busy=true;S.sync='sync';hdrSync();
 fetch(S.url,{method:'POST',body:JSON.stringify(S.q[0])}).then(function(r){return r.json();}).then(function(r){
  if(!r.ok)throw new Error(r.error||'gagal');S.q.shift();busy=false;pump();
 }).catch(function(){busy=false;S.sync='err';hdrSync();});
}
function retry(){if(S.sync==='err'){pump();}}
function hdrSync(){var e=$('sync');if(!e)return;e.className='sy '+(S.sync==='err'?'err':'');e.textContent={ok:'',sync:'Menyimpan…',err:'Gagal menyimpan. Ketuk untuk ulangi'}[S.sync];}
function load(){
 fetch(S.url+'?action=list').then(function(r){return r.json();}).then(function(r){
  if(!r.ok)throw new Error(r.error);
  if(!S.q.length&&!busy){S.awal=r.saldoAwal;S.rows=r.rows.map(function(x){return{id:x.id,tgl:x.tgl,keg:x.keg,u:x.uraian,m:x.masuk,k:x.keluar,kartu:x.kartu||''};});persist();}
  S.ready=true;S.loadErr='';if(route()==='/'&&!S.pick&&!S.drawer&&!S.mg)render();
 }).catch(function(){S.ready=true;S.loadErr='Belum tersambung. Menampilkan data terakhir.';if(route()==='/'&&!S.pick&&!S.drawer&&!S.mg)render();});
}
window.addEventListener('beforeunload',function(e){if(S.q.length){e.preventDefault();e.returnValue='';}});

/* ---- setup ---- */
function vSetup(){return'<div class="hd" style="padding-bottom:30px"><div class="eyebrow">Selamat datang</div><div class="big">Buku Kas</div></div><div class="pad"><p class="mute" style="margin-top:18px">Tempel alamat web app dari Google Apps Script (berakhiran /exec). Cukup sekali di HP ini.</p><div class="lb">Alamat web app</div><input id="url" value="'+esc(S.urlTmp||'')+'" placeholder="https://script.google.com/macros/s/…/exec" autocapitalize="off" autocorrect="off" spellcheck="false">'+(S.setupErr?'<div class="err">'+S.setupErr+'</div>':'')+'<div style="height:18px"></div><button class="btn g" onclick="connect()">'+(S.testing?'Menghubungkan…':'Hubungkan')+'</button></div>';}
function connect(){
 var u=$('url').value.trim();S.urlTmp=u;
 if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){S.setupErr='Alamat harus berakhiran /exec.';return render();}
 S.testing=true;S.setupErr='';render();
 fetch(u+'?action=list').then(function(r){return r.json();}).then(function(r){
  if(!r.ok)throw 0;S.testing=false;S.url=u;localStorage.setItem('bk_url',u);location.hash='/';load();render();
 }).catch(function(){S.testing=false;S.setupErr='Tidak bisa tersambung. Pastikan akses web app diatur ke "Anyone".';render();});
}

/* ---- beranda: satu rahina sekali lihat ---- */
function curGroup(gs){var g=gs.filter(function(x){return x.k===S.sel;})[0];return g||gs.slice().sort(function(a,b){return b.li-a.li;})[0];}
function toastHtml(){return S.toast?'<div class="toast"><span>'+S.toast.t+'</span>'+(S.toast.u?'<u onclick="undo()">Batalkan</u>':'')+'</div>':'';}
function vHome(){
 var t=total(),gs=groups(withS(),true),g=curGroup(gs),pend=pendRows();
 var h='<div class="hd"><div class="r1" style="justify-content:flex-start;gap:8px"><button class="ib" style="margin:-8px 0 -8px -10px" onclick="S.drawer=true;render()" aria-label="Buka menu">'+ic('menu')+'</button><span class="eyebrow">Saldo kas</span></div><div class="big num">Rp '+fmt(t.s)+'</div><div class="sl">'+CFG.judul+', '+CFG.tahun+' <span id="sync" class="sy" onclick="retry()"></span></div></div>';
 h+='<div class="cur">';
 if(!S.ready)h+='<div class="empty">Memuat…</div>';
 else if(!g)h+='<div class="empty">Belum ada catatan.<br>Ketuk Catat transaksi untuk mulai.</div>';
 else{var m=0,o=0;g.a.forEach(function(r){m+=r.m;o+=r.k;});
  h+='<button class="pillsel" onclick="S.pick=true;render()"><span>'+esc(gShort(g))+'</span>'+ic('down')+'</button><div class="stats num"><div><small>Masuk</small><b class="in">'+fmt(m)+'</b></div><div><small>Keluar</small><b class="out">'+fmt(o)+'</b></div><div><small>Selisih</small><b>'+(m-o<0?'− ':'')+fmt(Math.abs(m-o))+'</b></div></div>';}
 h+='</div>';
 if(S.loadErr)h+='<div class="banner">'+S.loadErr+'</div>';
 if(pend.length){var pm=0,pk=0;pend.forEach(function(r){pm+=r.m;pk+=r.k;});h+='<div class="band" onclick="openMg()">'+ic('bell')+'<span class="t"><b>'+pend.length+' catatan menunggu rahina berikutnya</b><span class="num">+'+fmt(pm)+' / −'+fmt(pk)+'</span></span><u>Gabungkan</u></div>';}
 if(g){h+='<div class="lst">';g.a.forEach(function(r){var i=r.m>0;h+='<div class="row" onclick="openForm(\''+r.id+'\')"><div style="min-width:0"><div class="u">'+esc(r.u)+'</div><div class="d">'+fd(r.tgl)+'</div></div><div class="a num '+(i?'in':'out')+'">'+(i?'+ ':'− ')+fmt(i?r.m:r.k)+'</div></div>';});h+='</div>';}
 h+='<div class="fw"><button class="fab" onclick="openForm(null)" aria-label="Catat transaksi">'+ic('plus')+'</button></div>'+toastHtml();
 return h;
}
function vPick(){
 var gs=groups(withS(),true);S.pk=gs.map(function(g){return g.k;});var cur=curGroup(gs);
 var h='<div class="ov" onclick="if(event.target===this){S.pick=false;render()}"><div class="sheet"><div class="grip"></div><div class="st">Pilih rahina</div>';
 gs.forEach(function(g,i){var m=0,o=0;g.a.forEach(function(r){m+=r.m;o+=r.k;});h+='<button class="pr" onclick="selK('+i+')">'+(cur&&g.k===cur.k?'<span class="dot"></span>':'<span style="width:8px"></span>')+'<span class="t"><b style="font-weight:500">'+esc(gShort(g))+'</b><small>'+span(g)+', '+g.a.length+' catatan</small></span><span class="num '+(m-o>=0?'in':'out')+'" style="font-weight:500">'+(m-o<0?'− ':'+ ')+fmt(Math.abs(m-o))+'</span></button>';});
 return h+'</div></div>';
}
function selK(i){S.sel=S.pk[i];S.pick=false;render();}
function toast(t,u){S.toast={t:t,u:u};clearTimeout(TM);TM=setTimeout(function(){S.toast=null;if(route()==='/'&&!S.pick&&!S.drawer&&!S.mg)render();},6000);}
function undo(){var r=S.toast&&S.toast.u;if(r){S.rows.push(r);enq('add',r);persist();S.toast=null;render();}}

/* ---- form catat ---- */
var GAP_NOTE='Rahina sama dengan tanggal sama masuk ke kartu yang sama. Tanggal berbeda membuat kartu baru.';
function cards(){return groups(S.rows.map(function(r,i){return Object.assign({i:i},r);}).filter(function(r){return r.keg!==LUAR;}),true);}
function cardsOf(keg){return cards().filter(function(g){return g.keg===keg;});}
function autoKartu(keg,t){
 if(keg===LUAR)return'';
 var hit=null;
 cardsOf(keg).forEach(function(g){if(!hit&&g.a.some(function(r){return r.tgl===t;}))hit=g.k;});
 return hit||'new';
}
function kForm(r){return r.keg===LUAR?'':ck(r);}
function lastToday(){return S.last&&S.last.d===today()?S.last:null;}
function defAt(t){
 var a=S.rows.filter(function(r){return r.tgl===t;});
 if(a.length){var r=a[a.length-1];return{keg:r.keg,kartu:kForm(r),hint:'Otomatis dari catatan lain di tanggal ini'};}
 return{keg:LUAR,kartu:'',hint:'Belum ada rahina di tanggal ini, jadi di luar rahina'};
}
function defNew(){
 var t=today(),l=lastToday();
 if(l)return{keg:l.keg,kartu:autoKartu(l.keg,t),hint:'Otomatis dari catatan terakhir hari ini'};
 var d=defAt(t);
 if(d.keg===LUAR)d.hint='Hari baru, otomatis di luar rahina';
 return d;
}
function freshF(t,d){d=d||defAt(t);return{jenis:'',nom:'',u:'',tgl:t,keg:d.keg,kartu:d.kartu,hint:d.hint,err:'',note:''};}
function openForm(id){
 if(id){var r=S.rows.filter(function(x){return x.id===id;})[0];S.ed=id;S.F={jenis:r.m>0?'masuk':'keluar',nom:fmt(r.m||r.k),u:r.u,tgl:r.tgl,keg:r.keg,kartu:kForm(r),hint:'',err:'',note:''};}
 else{S.ed=null;S.F=freshF(today(),defNew());}
 S.msg=null;S.sh=false;location.hash='/form';
}
function sugList(q){
 q=q.trim().toLowerCase();if(!q)return[];var m={};
 S.rows.forEach(function(r){var k=r.u.toLowerCase(),o=m[k]||(m[k]={u:r.u,n:0,j:{}});o.n++;o.j[r.m>0?'masuk':'keluar']=1;});
 return Object.keys(m).map(function(k){return m[k];}).filter(function(x){var l=x.u.toLowerCase();return l!==q&&(l.indexOf(q)===0||l.split(/\s+/).some(function(w){return w.indexOf(q)===0;}));}).sort(function(a,b){return b.n-a.n;}).slice(0,4).map(function(x){var j=Object.keys(x.j);return{u:x.u,j:j.length===1?j[0]:''};});
}
function sugHtml(){S.sg=sugList(S.F.u);if(!S.sg.length)return'';return'<div class="sg">'+S.sg.map(function(x,i){return'<div onclick="pick('+i+')"><span>'+esc(x.u)+'</span><small class="'+(x.j==='masuk'?'in':x.j==='keluar'?'out':'')+'" style="'+(x.j?'':'color:var(--mute)')+'">'+(x.j?'biasanya '+x.j:'bisa masuk atau keluar')+'</small></div>';}).join('')+'</div>';}
function pick(i){var x=S.sg[i];S.F.u=x.u;S.F.err='';if(x.j){S.F.jenis=x.j;S.F.note='Jenis diisi dari riwayat. Cek lagi sebelum simpan.';}else{S.F.note='';}render();setTimeout(function(){var e=$('fnom');if(e)e.focus();},0);}
function upU(el){S.F.u=el.value;$('sug').innerHTML=sugHtml();updSum();}
function nomIn(el){var n=num(el.value);S.F.nom=n?n.toLocaleString('id-ID'):'';el.value=S.F.nom;updSum();}
function summary(){var F=S.F,n=num(F.nom);if(!F.jenis||!n||!F.u.trim())return'';return'<b>'+(F.jenis==='masuk'?'Uang masuk':'Uang keluar')+'</b> Rp '+fmt(n)+' untuk '+esc(F.u.trim())+', '+esc(F.keg)+'.';}
function updSum(){var e=$('sum');if(e){var t=summary();e.innerHTML=t;e.style.display=t?'block':'none';}}
function setJ(j){S.F.jenis=j;S.F.err='';S.F.note='';render();}
function setKeg(i){S.F.keg=rahList()[i];S.F.kartu=autoKartu(S.F.keg,S.F.tgl);S.F.hint='';render();}
function newKeg(){var n=prompt('Nama rahina baru');if(n&&n.trim()){S.F.keg=n.trim();S.F.kartu=autoKartu(S.F.keg,S.F.tgl);S.F.hint='';render();}}
function setKartu(i){S.F.kartu=i<0?'new':cardsOf(S.F.keg)[i].k;render();}
function setTgl(v){if(!v)return;S.F.tgl=v;if(!S.ed){var d=defAt(v);S.F.keg=d.keg;S.F.kartu=d.kartu;S.F.hint=d.hint;}render();}
function vForm(){
 var F=S.F,e=F.err,i=F.jenis==='masuk',o=F.jenis==='keluar',ed=S.ed;
 var kinfo=F.keg===LUAR?'':(F.kartu==='new'?'Kartu baru. ':'Masuk ke kartu yang sudah ada. ');
 var h='<div class="hd sm"><button class="ib" onclick="history.back()" aria-label="Kembali">'+ic('back')+'</button><div class="ttl">'+(ed?'Ubah transaksi':'Catat transaksi')+'</div></div><div class="pad" style="padding-bottom:150px">';
 if(S.msg)h+='<div class="note '+(S.msg.i?'i':'o')+'">'+S.msg.t+'</div>';
 h+='<div class="seg'+(e==='jenis'?' bad':'')+'"><button class="i'+(i?' on':'')+'" onclick="setJ(\'masuk\')">Masuk</button><button class="o'+(o?' on':'')+'" onclick="setJ(\'keluar\')">Keluar</button></div>';
 h+=e==='jenis'?'<div class="err">Pilih masuk atau keluar dulu.</div>':(F.note?'<div class="mute" style="margin-top:6px;font-size:12px">'+F.note+'</div>':'');
 h+='<div class="lb">Nominal</div><input id="fnom" class="nom num'+(e==='nom'?' bad':'')+'" inputmode="numeric" value="'+F.nom+'" placeholder="Rp 0" oninput="nomIn(this)">'+(e==='nom'?'<div class="err">Isi nominal lebih dari 0.</div>':'');
 h+='<div class="lb">Uraian</div><input id="fu" class="'+(e==='u'?'bad':'')+'" value="'+esc(F.u)+'" placeholder="Ketik: beli, uru, suka" oninput="upU(this)" autocomplete="off"><div id="sug">'+sugHtml()+'</div>'+(e==='u'?'<div class="err">Isi uraian transaksi.</div>':'');
 h+='<div style="height:18px"></div><button class="ro" onclick="S.sh=true;render()">'+ic('cal')+'<span class="t">'+fd(F.tgl)+', '+esc(F.keg)+'<small>'+kinfo+F.hint+'</small></span><u>Ubah</u></button>'+(e==='tgl'?'<div class="err">Pilih tanggal.</div>':'');
 var t=summary();
 h+='</div><div class="fb"><div id="sum" class="sm" style="display:'+(t?'block':'none')+'">'+t+'</div><div class="fr">'+(ed?'<button class="tb" onclick="del()" aria-label="Hapus transaksi">'+ic('trash')+'</button>':'')+'<button class="btn '+(i?'i':o?'o':'')+'" onclick="save()">'+(ed?'Simpan perubahan':i?'Simpan pemasukan':o?'Simpan pengeluaran':'Simpan')+'</button></div></div>';
 return h;
}
function vSheet(){
 var F=S.F,cs=F.keg===LUAR?[]:cardsOf(F.keg),rl=rahList();
 var h='<div class="ov" onclick="if(event.target===this){S.sh=false;render()}"><div class="sheet"><div class="grip"></div><div class="st">Rahina dan tanggal</div><div class="lb" style="margin-top:0">Tanggal</div><input type="date" value="'+F.tgl+'" onchange="setTgl(this.value)">';
 h+='<div class="lb">Rahina</div><div class="chips">'+rl.map(function(r,n){return'<button class="ch'+(F.keg===r?' on':'')+'" onclick="setKeg('+n+')">'+esc(r)+'</button>';}).join('')+'<button class="ch dash" onclick="newKeg()">+ Baru</button></div>';
 if(cs.length)h+='<div class="lb">Masuk ke kartu</div><div class="chips">'+cs.map(function(g,n){return'<button class="ch'+(F.kartu===g.k?' on':'')+'" onclick="setKartu('+n+')">'+span(g)+'</button>';}).join('')+'<button class="ch'+(F.kartu==='new'?' on':'')+'" onclick="setKartu(-1)">Kartu baru</button></div>';
 h+='<div class="mute" style="margin-top:10px;font-size:12px">'+GAP_NOTE+'</div><button class="btn g" style="margin-top:18px" onclick="S.sh=false;render()">Selesai</button></div></div>';
 return h;
}
function save(){
 var F=S.F,n=num(F.nom);
 if(!F.jenis){F.err='jenis';return render();}
 if(!n){F.err='nom';return render();}
 if(!F.u.trim()){F.err='u';return render();}
 if(!F.tgl){F.err='tgl';return render();}
 var inn=F.jenis==='masuk',orig=S.ed?S.rows.filter(function(r){return r.id===S.ed;})[0]:null;
 var wasNew=F.kartu==='new'&&F.keg!==LUAR,kid=F.keg===LUAR?((orig&&orig.keg===LUAR)?orig.kartu:''):(F.kartu==='new'?'k'+uid():F.kartu);
 var o={tgl:F.tgl,keg:F.keg,u:F.u.trim(),m:inn?n:0,k:inn?0:n,kartu:kid};
 if(S.ed){o.id=S.ed;S.rows[S.rows.findIndex(function(r){return r.id===S.ed;})]=o;enq('update',o);persist();S.sel=ck(o);toast('Perubahan disimpan');history.back();return;}
 o.id=uid();S.rows.push(o);enq('add',o);persist();S.sel=ck(o);S.last={d:today(),keg:F.keg};try{localStorage.setItem('bk_last',JSON.stringify(S.last));}catch(e){}
 S.msg={i:inn,t:(inn?'Pemasukan':'Pengeluaran')+' Rp '+fmt(n)+' tersimpan. Saldo '+(inn?'naik':'turun')+' jadi Rp '+fmt(total().s)+'.'};
 var t=F.tgl,k=F.keg,pend=pendRows();
 S.F=freshF(t);S.F.keg=k;S.F.kartu=kid;S.F.hint='Otomatis dari catatan yang baru disimpan';
 if(wasNew&&pend.length){S.mg={target:ck(o),sel:{}};pend.forEach(function(r){S.mg.sel[r.id]=true;});}
 render();window.scrollTo(0,0);
}
function del(){var r=S.rows.filter(function(x){return x.id===S.ed;})[0];S.rows=S.rows.filter(function(x){return x.id!==S.ed;});enq('delete',r);persist();toast('Transaksi dihapus',r);history.back();}

/* ---- gabungkan catatan di luar rahina ---- */
function openMg(){var cs=cards();if(!cs.length){alert('Belum ada rahina untuk digabungi.');return;}var lt=cs.slice().sort(function(a,b){return b.li-a.li;})[0];S.mg={target:lt.k,sel:{}};pendRows().forEach(function(r){S.mg.sel[r.id]=true;});render();}
function mgTog(id){S.mg.sel[id]=!S.mg.sel[id];render();}
function mgIds(){return pendRows().filter(function(r){return S.mg.sel[r.id];});}
function mgDone(t){if(route()==='/form')S.msg={i:true,t:t};else toast(t);S.mg=null;render();}
function mgGo(){var g=cards().filter(function(x){return x.k===S.mg.target;})[0],ids=mgIds();if(!g||!ids.length)return;ids.forEach(function(r){r.keg=g.keg;r.kartu=g.k;enq('update',r);});persist();S.sel=g.k;mgDone(ids.length+' catatan digabung ke '+gTitle(g)+'.');}
function mgStay(){var ids=mgIds();if(!ids.length)return;ids.forEach(function(r){r.kartu='tetap';enq('update',r);});persist();mgDone(ids.length+' catatan tetap di luar rahina.');}
function mgClose(){S.mg=null;render();}
function vMerge(){
 var p=pendRows(),cs=cards(),n=mgIds().length;
 var h='<div class="ov" onclick="if(event.target===this)mgClose()"><div class="sheet"><div class="grip"></div><div class="st">Gabungkan catatan di luar rahina</div><div class="mute" style="margin:-8px 0 14px">Tanggal asli catatan tidak berubah.</div>';
 if(!p.length)return h+'<div class="empty">Tidak ada catatan yang menunggu.</div><button class="btn" onclick="mgClose()">Tutup</button></div></div>';
 h+='<div class="lb" style="margin-top:0">Gabungkan ke</div><select onchange="S.mg.target=this.value">'+cs.map(function(g){return'<option value="'+esc(g.k)+'"'+(g.k===S.mg.target?' selected':'')+'>'+esc(gTitle(g))+'</option>';}).join('')+'</select><div class="lb">Pilih catatan</div>';
 p.forEach(function(r){var i=r.m>0;h+='<div class="cr" onclick="mgTog(\''+r.id+'\')"><span class="cb'+(S.mg.sel[r.id]?' on':'')+'">'+(S.mg.sel[r.id]?ic('chk'):'')+'</span><div style="flex:1;min-width:0"><div style="overflow-wrap:anywhere">'+esc(r.u)+'</div><div class="mute" style="font-size:12px">'+fd(r.tgl)+'</div></div><div class="num '+(i?'in':'out')+'" style="font-weight:500">'+(i?'+ ':'− ')+fmt(i?r.m:r.k)+'</div></div>';});
 return h+'<div style="height:8px"></div><button class="btn g" onclick="mgGo()">'+(n?'Gabungkan '+n+' catatan':'Pilih catatan dulu')+'</button><button class="btn ghost" onclick="mgStay()">Tetap di luar rahina</button><button class="btn ghost" style="border:0;color:var(--mute)" onclick="mgClose()">Nanti saja</button></div></div>';
}

/* ---- pengaturan ---- */
function vSet(){return'<div class="hd sm"><button class="ib" onclick="S.drawer=true;render()" aria-label="Buka menu">'+ic('menu')+'</button><div class="ttl">Pengaturan</div></div><div class="pad"><div class="lb" style="margin-top:8px">Saldo awal (kas sebelumnya)</div><input id="sa" class="nom num" inputmode="numeric" value="'+fmt(S.awal)+'" oninput="var n=num(this.value);this.value=n?n.toLocaleString(\'id-ID\'):\'\'"><div class="mute" style="margin:8px 0 16px">Semua saldo dihitung ulang dari angka ini.</div><button class="btn g" onclick="saveAwal()">Simpan saldo awal</button><div class="lb" style="margin-top:30px">Tampilan</div><div class="chips">'+[['light','Terang'],['dark','Gelap'],['auto','Ikuti HP']].map(function(x){return'<button class="ch'+((localStorage.getItem('bk_theme')||'light')===x[0]?' on':'')+'" onclick="setTheme(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div><div class="lb" style="margin-top:30px">Alamat web app</div><input id="url2" value="'+esc(S.url)+'" autocapitalize="off" spellcheck="false"><button class="btn ghost" onclick="saveUrl()">Simpan alamat</button></div>';}
function setTheme(v){try{localStorage.setItem('bk_theme',v);}catch(e){}applyTheme(v);render();}
function saveAwal(){S.awal=num($('sa').value);S.q.push({action:'setAwal',saldoAwal:S.awal});pump();persist();toast('Saldo awal disimpan');location.hash='/';}
function saveUrl(){var u=$('url2').value.trim();if(/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){S.url=u;localStorage.setItem('bk_url',u);load();toast('Alamat disimpan');location.hash='/';}else alert('Alamat harus berakhiran /exec');}

/* ---- ekspor ---- */
function openEx(){var a=sorted();S.ex={from:a.length?a[0].tgl:today(),to:a.length?a[a.length-1].tgl:today()};S.exMsg='';}
function setEx(f,t){S.ex.from=f;S.ex.to=t;render();}
function exStats(){var e=S.ex,b=S.awal,m=0,k=0,n=0;sorted().forEach(function(r){if(r.tgl<e.from)b+=r.m-r.k;else if(r.tgl<=e.to){m+=r.m;k+=r.k;n++;}});return{n:n,m:m,k:k,aw:b,ak:b+m-k};}
function vExport(){
 var e=S.ex,st=exStats(),a=sorted(),t=today(),mo=t.slice(0,8),d=new Date();d.setMonth(d.getMonth()-3);var t3=d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate());
 var h='<div class="hd sm"><button class="ib" onclick="S.drawer=true;render()" aria-label="Buka menu">'+ic('menu')+'</button><div class="ttl">Laporan</div></div><div class="pad"><div class="chips" style="margin-top:8px"><button class="ch" onclick="setEx(\''+(a.length?a[0].tgl:t)+'\',\''+(a.length?a[a.length-1].tgl:t)+'\')">Semua</button><button class="ch" onclick="setEx(\''+mo+'01\',\''+mo+'31\')">Bulan ini</button><button class="ch" onclick="setEx(\''+t3+'\',\''+t+'\')">3 bulan terakhir</button></div>';
 h+='<div class="lb">Dari tanggal</div><input type="date" value="'+e.from+'" onchange="S.ex.from=this.value;render()"><div class="lb">Sampai tanggal</div><input type="date" value="'+e.to+'" onchange="S.ex.to=this.value;render()">';
 if(e.from>e.to)h+='<div class="err" style="margin-top:14px">Tanggal awal harus sebelum tanggal akhir.</div>';
 else h+='<div class="sum"><div class="kv"><span class="mute">Jumlah transaksi</span><span class="num">'+st.n+'</span></div><div class="kv"><span class="mute">Saldo awal periode</span><span class="num">Rp '+fmt(st.aw)+'</span></div><div class="kv"><span class="mute">Masuk</span><span class="num in">+ '+fmt(st.m)+'</span></div><div class="kv"><span class="mute">Keluar</span><span class="num out">− '+fmt(st.k)+'</span></div><div class="kv" style="border-top:1px solid var(--line);margin-top:4px;padding-top:9px;font-weight:700"><span>Saldo akhir periode</span><span class="num">Rp '+fmt(st.ak)+'</span></div></div>';
 return h+'<button class="btn g" onclick="doExport()">Unduh Excel (.xlsx)</button>'+(S.exMsg?'<div class="err">'+S.exMsg+'</div>':'')+'<div class="mute" style="text-align:center;margin-top:10px;font-size:12px">Kolom sama seperti buku kas Anda: No, Uraian, Masuk, Keluar, Saldo.</div></div>';
}
function loadX(){return window.XLSX?Promise.resolve():new Promise(function(res,rej){var s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=res;s.onerror=function(){rej();};document.head.appendChild(s);});}
function doExport(){
 var e=S.ex;if(e.from>e.to)return;S.exMsg='';
 loadX().then(function(){
  var st=exStats(),rows=withS().filter(function(r){return r.tgl>=e.from&&r.tgl<=e.to;});
  var A=[[CFG.xls],['TAHUN '+CFG.tahun],[],['No','URAIAN','MASUK','KELUAR','SALDO'],['','KAS SEBELUMNYA',st.aw,'',st.aw]],s=st.aw,n=1,tm=0,tk=0;
  groups(rows).forEach(function(g){A.push(['',gTitle(g),'','','']);g.a.forEach(function(r){s+=r.m-r.k;tm+=r.m;tk+=r.k;A.push([n++,r.u,r.m||'',r.k||'',s]);});});
  A.push(['','JUMLAH',tm,tk,s]);
  var ws=XLSX.utils.aoa_to_sheet(A);ws['!cols']=[{wch:5},{wch:40},{wch:16},{wch:16},{wch:16}];ws['!merges']=[{s:{r:0,c:0},e:{r:0,c:4}},{s:{r:1,c:0},e:{r:1,c:4}}];
  Object.keys(ws).forEach(function(k){if(k[0]!=='!'&&typeof ws[k].v==='number'&&/^[CDE]/.test(k))ws[k].z='#,##0';});
  var wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Buku Kas');
  XLSX.writeFile(wb,'Buku_Kas_'+e.from+'_sd_'+e.to+'.xlsx');
 }).catch(function(){S.exMsg='Gagal memuat pustaka Excel. Periksa sinyal, lalu coba lagi.';render();});
}

/* ---- menu samping ---- */
function vDrawer(){
 var r=route(),it=[['/','home','Beranda'],['/cari','search','Cari transaksi'],['/export','dl','Laporan'],['/set','set','Pengaturan']];
 var h='<div class="dov" onclick="if(event.target===this){S.drawer=false;render()}"><nav class="drw"><div class="dh"><div class="eyebrow">Buku Kas</div><div class="dt">'+CFG.judul+'</div><div class="ds">Tahun '+CFG.tahun+'</div></div><div class="di">';
 it.forEach(function(x){h+='<button class="dm'+(r===x[0]?' on':'')+'" onclick="goTo(\''+x[0]+'\')">'+ic(x[1])+x[2]+'</button>';});
 return h+'</div><div class="df">'+({ok:'Semua perubahan tersimpan',sync:'Menyimpan…',err:'Ada perubahan yang gagal tersimpan'}[S.sync])+'</div></nav></div>';
}
function goTo(r){S.drawer=false;if(r==='/export')openEx();if(route()===r)render();else location.hash=r;}

/* ---- cari transaksi ---- */
function hl(t,q){var i=t.toLowerCase().indexOf(q);if(i<0)return esc(t);return esc(t.slice(0,i))+'<mark>'+esc(t.slice(i,i+q.length))+'</mark>'+esc(t.slice(i+q.length));}
function cariRes(){
 var q=S.cq.trim().toLowerCase(),f=S.cf;
 if(!q)return'<div class="empty">Ketik uraian atau nominal untuk mencari.</div>';
 var dg=q.replace(/[.\s]/g,''),isNum=/^\d+$/.test(dg);
 var rs=sorted().reverse().filter(function(r){var hit=r.u.toLowerCase().indexOf(q)>=0||(isNum&&String(r.m||r.k).indexOf(dg)>=0);return hit&&(f==='all'||(f==='masuk'&&r.m>0)||(f==='keluar'&&r.k>0));});
 if(!rs.length)return'<div class="empty">Tidak ada hasil.</div>';
 var m=0,k=0;rs.forEach(function(r){m+=r.m;k+=r.k;});
 var parts=[rs.length+' hasil'];if(m)parts.push('total masuk Rp '+fmt(m));if(k)parts.push('total keluar Rp '+fmt(k));
 var h='<div class="mute" style="padding:12px 16px 6px;font-size:12px">'+parts.join(', ')+'</div><div class="lst" style="margin-top:0">';
 rs.slice(0,100).forEach(function(r){var i=r.m>0;h+='<div class="row" onclick="openForm(\''+r.id+'\')"><div style="min-width:0"><div class="u">'+hl(r.u,q)+'</div><div class="d">'+fd(r.tgl)+', '+esc(r.keg)+'</div></div><div class="a num '+(i?'in':'out')+'">'+(i?'+ ':'− ')+fmt(i?r.m:r.k)+'</div></div>';});
 h+='</div>';
 if(rs.length>100)h+='<div class="mute" style="padding:10px 16px;font-size:12px">Menampilkan 100 hasil terbaru. Persempit pencarian untuk melihat yang lain.</div>';
 return h;
}
function cariIn(el){S.cq=el.value;$('res').innerHTML=cariRes();$('cx').style.display=S.cq?'grid':'none';}
function clearCari(){S.cq='';render();setTimeout(function(){var e=$('cq');if(e)e.focus();},0);}
function setCf(f){S.cf=f;render();}
function vCari(){
 var h='<div class="hd sm" style="display:block;padding-bottom:18px"><div style="display:flex;align-items:center;gap:6px;margin-bottom:10px"><button class="ib" onclick="S.drawer=true;render()" aria-label="Buka menu">'+ic('menu')+'</button><div class="ttl">Cari transaksi</div></div><div class="sbox">'+ic('search')+'<input id="cq" type="search" value="'+esc(S.cq)+'" placeholder="Uraian atau nominal" oninput="cariIn(this)" autocomplete="off"><button id="cx" class="ib" style="display:'+(S.cq?'grid':'none')+';color:var(--mute)" onclick="clearCari()" aria-label="Hapus pencarian">'+ic('x')+'</button></div></div>';
 h+='<div class="chips" style="padding:14px 16px 0">'+[['all','Semua'],['masuk','Masuk'],['keluar','Keluar']].map(function(x){return'<button class="ch'+(S.cf===x[0]?' on':'')+'" onclick="setCf(\''+x[0]+'\')">'+x[1]+'</button>';}).join('')+'</div><div id="res">'+cariRes()+'</div>';
 return h;
}

/* ---- router ---- */
function render(){
 var r=route(),h;
 if(!S.url)h=vSetup();
 else if(r==='/form'&&S.F){h=vForm();if(S.sh)h+=vSheet();}
 else if(r==='/cari')h=vCari();
 else if(r==='/set')h=vSet();
 else if(r==='/export')h=vExport();
 else{h=vHome();if(S.pick)h+=vPick();}
 if(S.mg)h+=vMerge();
 if(S.drawer)h+=vDrawer();
 $('app').innerHTML=h;
 if(r!==S.lastR){window.scrollTo(0,0);S.lastR=r;}
 hdrSync();
}
var ly=0;window.addEventListener('scroll',function(){var y=window.scrollY,f=document.querySelector('.fab');if(f){if(y>ly+6&&y>80)f.classList.add('hide');else if(y<ly-6||y<=80)f.classList.remove('hide');}ly=y;},{passive:true});
window.addEventListener('hashchange',function(){S.pick=false;S.drawer=false;S.sh=false;render();});
if(route()==='/form'||route()==='/export')location.hash='/';
render();
if(S.url)load();
</script>
</body>
</html>
